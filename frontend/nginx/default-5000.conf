server {
    listen       80;
    server_name  _ default;

    # 1. Servir le contenu statique (votre application React)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # Recommandé pour éviter les erreurs 404 lors du rafraîchissement des pages React (React Router)
    }

    # 2. Rediriger les requêtes vers l'API Backend
    location /api/ {
        proxy_pass http://backend:5000; # <-- Corrigé : utilise le DNS interne de Docker Compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Gestion des pages d'erreur
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}